name: CI

# One workflow per repo. `build` runs on every push and PR. Tests are not run here (`-DskipTests`): CI is a
# compile gate and the suite runs locally; -DskipTests still compiles the tests. This module pins nothing of
# BotMaker's, so nothing is checked out beside it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RETRIED — Maven Central answers 429 to GitHub-hosted runners; see .github/mvn-retry.sh.
      - name: Build
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -DskipTests package

  # The GitHub Release, published by JReleaser from the tag the umbrella's release pushed (jreleaser.yml says why
  # it runs here and not from the umbrella).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same script the release's ChangelogGate calls to gate this release.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
